spring.application.name=recorder

# Server Configuration
server.port=8080

application.time-zone=America/New_York

# MySQL database connection details
spring.datasource.url=${DB_HOST}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

# Hibernate settings (for JPA)
# testing
#spring.jpa.hibernate.ddl-auto=create-drop
# deployment
spring.jpa.hibernate.ddl-auto=update
#spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USER}
spring.mail.password=${MAIL_PASS}
spring.mail.protocol=${MAIL_PROTOCOL}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE}

# Log file location
logging.file.name=${BACKEND_APP_LOG_PATH:logs}/application.log
# Log levels
logging.level.root=info
logging.level.org.springframework=warn
logging.level.com.your.package=debug
logging.level.org.springframework.boot.autoconfigure.jdbc.DataSourceProperties=DEBUG


# JWT Configuration
jwt.secret=${JWT_SECRET}

recfile.upload.dir=${BACKEND_APP_FILE_PATH:uploaded_files/}
recfile.image.file.size=5
recfile.regular.file.size=5
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

admin.username=${ADMIN_USERNAME}
admin.password=${ADMIN_PASSWORD}
admin.email=${ADMIN_EMAIL}

# Data Processor Configuration
data-processor.base-url=http://data-processor:8082
