services:
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST
      - "6334:6334"   # gRPC
    volumes:
      - ${MARKET_PULSE_RESOURCE_PATH_SERVER}/qdrant:/qdrant/storage

  market-pulse:
    build:
      context: ./market_pulse
      dockerfile: Dockerfile
    image: yipeng6257/market-pulse-api:latest
    container_name: market-pulse-api
    restart: unless-stopped
    env_file: .env
    ports:
      - "${MARKET_PULSE_API_PORT:-8000}:8000"
    volumes:
      - ${MARKET_PULSE_RESOURCE_PATH_SERVER}:/app/market_pulse/resources
    depends_on:
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://localhost:8000/health').read(); sys.exit(0)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  recorder-backend:
    build:
      context: ./recorder-backend
      dockerfile: Dockerfile
      args:
        APP_TIMEZONE: ${APP_TIMEZONE}
        BACKEND_APP_LOG_PATH: ${BACKEND_APP_LOG_PATH}
        BACKEND_APP_FILE_PATH: ${BACKEND_APP_FILE_PATH}
    image: yipeng6257/recorder-backend:latest
    container_name: recorder-backend
    restart: unless-stopped
    env_file: .env
    ports:
      - "8080:8080"
    volumes:
      - ${BACKEND_APP_LOG_PATH_SERVER}:${BACKEND_APP_LOG_PATH}
      - ${BACKEND_APP_FILE_PATH_SERVER}:${BACKEND_APP_FILE_PATH}
    depends_on:
      market-pulse:
        condition: service_healthy

networks:
  default:
    driver: bridge
