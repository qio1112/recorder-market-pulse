services:
  recorder-backend:
    build:
      context: ./recorder-backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      # MySQL connection
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/recorder
      SPRING_DATASOURCE_USERNAME: youruser
      SPRING_DATASOURCE_PASSWORD: yourpass

      # These pick up the Dockerfile's ENV defaults if you don't override
      APP_LOG_PATH: /app/logs/application.log
      APP_FILE_PATH: /app/uploaded_files
    volumes:
      - /Users/baomini/market_pulse/backend/applog:/app/logs
      - /Users/baomini/market_pulse/backend/uploaded_files:/app/uploaded_files
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app-network

  # Stock API Service (optional - for demo/testing)
  stock-api-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.stock-api-service
    container_name: stock-api-service
    ports:
      - "8081:8081"
    environment:
      # Database configuration (optional - service works without DB)
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/stock_data?useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: stockuser
      SPRING_DATASOURCE_PASSWORD: stockpass
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      
      # Application specific settings
      SERVER_PORT: 8081
      LOGGING_LEVEL_COM_YIPENG_STOCKAPI: INFO
    volumes:
      - ./stock-api-service/logs:/app/logs
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/api/stocks/market-summary"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    profiles:
      - stock-api  # Only start when explicitly requested

  # Shared MySQL database
  mysql:
    image: mysql:8.0
    container_name: recorder-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: recorder
      MYSQL_USER: youruser
      MYSQL_PASSWORD: yourpass
      # Additional database for stock data
      MYSQL_MULTIPLE_DATABASES: recorder,stock_data
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  mysql_data:

networks:
  app-network:
    driver: bridge
