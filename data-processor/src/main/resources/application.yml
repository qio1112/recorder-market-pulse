server:
  port: 8082

spring:
  application:
    name: data-processor
  
  datasource:
    url: jdbc:mysql://mysql:3306/stock_data?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASS:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

# Kafka Configuration
kafka:
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
  topics:
    stock-data: stock-data
    processed-data: processed-data
  consumer:
    group-id: data-processor-group
    auto-offset-reset: earliest

# Stock API Configuration
stock-api:
  base-url: ${STOCK_API_BASE_URL:http://stock-api-service:8081}
  websocket-url: ${STOCK_API_WEBSOCKET_URL:ws://stock-api-service:8081/ws}
  symbols:
    - AAPL
    - GOOGL
    - MSFT
    - AMZN
    - TSLA

# Spark Configuration
spark:
  app-name: StockDataProcessor
  master: local[*]
  streaming:
    batch-duration: 10000 # 10 seconds
    checkpoint-dir: /tmp/spark-checkpoint

# Processing Configuration
processing:
  moving-average:
    window-size: 6 # 6 batches = 1 minute (10s * 6 = 60s)
  batch-size: 100

# Logging
logging:
  level:
    com.yipeng.recorder.dataprocessor: INFO
    org.apache.spark: WARN
    org.apache.kafka: INFO
  pattern: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Actuator endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env
  endpoint:
    health:
      show-details: always 